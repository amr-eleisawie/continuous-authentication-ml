<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuous Authentication</title>
  <style>
    :root { --bg:#0b1220; --panel:#151c2c; --line:#26354f; --text:#f8fafc; --muted:#94a3b8; --cyan:#22d3ee; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px Inter,Segoe UI,Arial,sans-serif; }
    main { max-width:1060px; margin:0 auto; padding:44px 20px 70px; }
    .eyebrow { color:var(--cyan); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-size:clamp(30px,5vw,48px); letter-spacing:-.04em; }
    .subtitle { color:var(--muted); margin:0 0 28px; }
    .grid { display:grid; grid-template-columns:1.35fr .85fr; gap:20px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 18px 45px #0003; }
    .panel h2 { margin:0 0 18px; font-size:20px; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:13px; }
    input, select { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:#0f1727; color:var(--text); font-size:15px; }
    button { width:100%; margin-top:20px; border:0; border-radius:10px; padding:13px 16px; background:var(--cyan); color:#06131b; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .result { min-height:270px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
    .score { font-size:48px; font-weight:800; letter-spacing:-.05em; }
    .decision { margin-top:12px; border-radius:999px; padding:9px 15px; font-weight:800; letter-spacing:.05em; }
    .allow { color:var(--green); background:#22c55e1a; }
    .otp { color:var(--amber); background:#f59e0b1a; }
    .block { color:var(--red); background:#ef44441a; }
    .hint { color:var(--muted); font-size:13px; line-height:1.6; }
    pre { width:100%; overflow:auto; background:#0a101d; border:1px solid var(--line); border-radius:10px; padding:12px; color:#cbd5e1; font-size:12px; }
    @media (max-width:760px) { .grid,.fields { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Behavior-focused risk assessment</div>
    <h1>Continuous Authentication</h1>
    <p class="subtitle">Evaluate a session and route the decision to your n8n automation workflow.</p>
    <div class="grid">
      <section class="panel">
        <h2>Session features</h2>
        <form id="form">
          <div class="fields">
            <label>Session ID<input id="session_id" value="WEB-SESSION-001" /></label>
            <label>Timestamp<input id="timestamp" type="datetime-local" required /></label>
            <label>Keyboard Speed (WPM)<input id="Keyboard_Speed_WPM" type="number" value="50" min="0" required /></label>
            <label>Keystroke Duration (ms)<input id="Keystroke_Duration_ms" type="number" value="130" min="0" required /></label>
            <label>Typing Accuracy (%)<input id="Typing_Accuracy_pct" type="number" value="90" min="0" max="100" required /></label>
            <label>Mouse Speed (px/s)<input id="Mouse_Speed_pxs" type="number" value="320" min="0" required /></label>
            <label>CPU Usage (%)<input id="CPU_Usage_pct" type="number" value="45" min="0" max="100" required /></label>
            <label>Memory Usage (%)<input id="Memory_Usage_pct" type="number" value="50" min="0" max="100" required /></label>
            <label>Previous Auth Score<input id="Previous_Authentication_Score" type="number" value="0.75" min="0" max="1" step="0.01" required /></label>
            <label>Network Status<select id="Network_Status"><option>Stable</option><option>Unstable</option></select></label>
          </div>
          <button id="submit" type="submit">Check Session</button>
        </form>
      </section>
      <section class="panel result" id="result">
        <h2>Authentication result</h2>
        <p class="hint">Submit a session to receive a risk score and decision.</p>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const submit = document.getElementById('submit');
    const value = id => document.getElementById(id).value;
    const number = id => Number(value(id));
    form.addEventListener('submit', async event => {
      event.preventDefault();
      submit.disabled = true;
      result.innerHTML = '<h2>Authentication result</h2><p class="hint">Checking session...</p>';
      const payload = {
        session_id: value('session_id'),
        timestamp: new Date(value('timestamp')).toISOString(),
        Keyboard_Speed_WPM: number('Keyboard_Speed_WPM'),
        Keystroke_Duration_ms: number('Keystroke_Duration_ms'),
        Typing_Accuracy_pct: number('Typing_Accuracy_pct'),
        Mouse_Speed_pxs: number('Mouse_Speed_pxs'),
        CPU_Usage_pct: number('CPU_Usage_pct'),
        Memory_Usage_pct: number('Memory_Usage_pct'),
        Previous_Authentication_Score: number('Previous_Authentication_Score'),
        Network_Status: value('Network_Status')
      };
      try {
        const response = await fetch('/api/predict', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Prediction failed');
        const type = data.decision === 'ALLOW' ? 'allow' : data.decision === 'REQUEST_OTP' ? 'otp' : 'block';
        result.innerHTML = `<h2>Authentication result</h2><div class="score">${(data.risk_score * 100).toFixed(2)}%</div><div class="decision ${type}">${data.decision}</div><p class="hint">The result was sent to n8n when N8N_WEBHOOK_URL is configured.</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (error) { result.innerHTML = `<h2>Request failed</h2><p class="hint">${error.message}</p>`; }
      finally { submit.disabled = false; }
    });
    document.getElementById('timestamp').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0,16);
  </script>
</body>
</html>
